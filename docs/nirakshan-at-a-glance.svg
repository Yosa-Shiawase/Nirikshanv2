  <title id="title">NIRAKSHAN — the entire project at a glance</title>
  <desc id="desc">Full-system view: five input sources feed one stdlib Python core engine (Hawkes risk, EWMA burst watch, QR forensics, case tracer, LLM briefings, SQLite+SSE), which drives five operator surfaces; a live case trace shows the money decaying hop by hop toward the ATM cash-out that units pre-position at.</desc>

